[package]
name = "sinking-simulator-bevy"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
flate2 = "1.1.10"
crc32fast = "1.5.0"
bevy = "0.19.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.151"
rand = { version = "0.10.3", default-features = false, features = ["std"] }
rodio = { version = "0.22.2", default-features = false }
winit = "=0.30.13"
libloading = "0.8.9"
regex = "1.13.1"

[dev-dependencies]
naga = { version = "29.0.4", features = ["wgsl-in"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
